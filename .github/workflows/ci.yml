name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref so a quick second push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: privacy + build
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout
        # Pinned to full SHA (v4.2.2) — supply-chain hardening. The `v4` tag could be
        # re-pointed by a compromise of the actions/checkout repo, and CI would silently
        # run that code with our GITHUB_TOKEN. Pinning to a SHA prevents that.
        # Bump: `gh api repos/actions/checkout/git/refs/tags/v4.X.X --jq .object.sha`
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true
          sw_vers

      # Hard privacy gate — fails the build if any banned macOS API
      # appears in the source tree. See Sources/miniowl/Privacy/ForbiddenImports.swift
      # for the manifest and rationale.
      - name: Privacy check (banned APIs)
        run: ./scripts/check-privacy.sh

      - name: Swift build (release)
        run: swift build -c release

      - name: Verify binary exists
        run: |
          test -x .build/release/miniowl
          file .build/release/miniowl
          ls -lh .build/release/miniowl
